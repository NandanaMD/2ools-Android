AutoName: 2ools
Summary: Lightweight, 100% offline everyday utility suite
Description: |-
  2ools is a lightweight collection of essential everyday utilities designed to work completely offline.

  Features included:
  * Documents: Images to PDF, PDF to Images
  * Image: Compressor, Resizer, Format Converter, EXIF Inspector
  * QR & Barcodes: Scanner & Generator
  * Calculators: Percentage, Date & Age, EMI
  * Unit Converters: Length, Mass, Area, Volume, Temperature
  * Text & Security: Inspector, Case Converter, Hash Generator, Password Vault

  Privacy Guarantee:
  * 100% offline operation (no internet permission requested)
  * Zero advertisements, zero analytics, zero tracking

